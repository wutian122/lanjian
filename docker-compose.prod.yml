name: lanjian

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanjian_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lanjian}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lanjian-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lanjian-network

  db-migrate:
    image: wutian449/lanjian-backend:${IMAGE_TAG:-latest}
    restart: "no"
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanjian_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lanjian}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-lanjian_change_me}@db:5432/${POSTGRES_DB:-lanjian}
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lanjian-network

  backend:
    image: wutian449/lanjian-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanjian_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lanjian}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-lanjian_change_me}@db:5432/${POSTGRES_DB:-lanjian}
      REDIS_URL: redis://redis:6379/0
      AGENT_ENABLED: "true"
      SANDBOX_ENABLED: "true"
      SANDBOX_IMAGE: wutian449/lanjian-sandbox:${IMAGE_TAG:-latest}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    # 生产启动命令：单 worker、无 --reload、显式绑定所有接口。
    # ⚠️ 严禁在此加 --reload：文件变更会触发 uvicorn 重启，正在运行的 SSE 连接全部断开，
    # 内存中的 Orchestrator/EventManager 状态丢失（跨进程 Registry 尚未落地时会导致 stale running）。
    command: [".venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    networks:
      - lanjian-network

  frontend:
    image: wutian449/lanjian-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - lanjian-network

  sandbox:
    image: wutian449/lanjian-sandbox:${IMAGE_TAG:-latest}
    restart: "no"
    command: ["sh", "-c", "echo Sandbox image ready"]

networks:
  lanjian-network:
    name: lanjian-network
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
  redis_data:
