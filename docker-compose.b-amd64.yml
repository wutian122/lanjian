# 192.168.238.11 (amd) 现场 override。
# 仅在该机使用：`docker compose -f docker-compose.b-amd64.yml up -d`。
# 差异说明：
# - db 加 security_opt: seccomp:unconfined（CentOS 7 kernel 3.10 老内核，postgres 默认 seccomp 偶发启动失败）
# - 锁 v6.0.1（backend）/ v6.0.0（frontend）
# - 删除 P0/P3 注释（与功能无关）
name: lanjian

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanjian_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lanjian}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lanjian-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lanjian-network

  backend:
    image: wutian449/lanjian-backend:v6.4.1
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanjian_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lanjian}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-lanjian_change_me}@db:5432/${POSTGRES_DB:-lanjian}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY not set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      REDIS_URL: redis://redis:6379/0
      AGENT_ENABLED: "true"
      SANDBOX_ENABLED: "true"
      SANDBOX_IMAGE: wutian449/lanjian-sandbox:v6.1.0
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/lanjian:/tmp/lanjian:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c ".venv/bin/alembic upgrade head &&
             .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    networks:
      - lanjian-network

  frontend:
    image: wutian449/lanjian-frontend:v6.4.0
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - lanjian-network

  sandbox:
    image: wutian449/lanjian-sandbox:v6.1.0
    restart: "no"
    command: ["sh", "-c", "echo Sandbox image ready"]

networks:
  lanjian-network:
    name: lanjian-network
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
  redis_data:
