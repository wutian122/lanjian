name: lanjian

# 镜像锁版本：v6.0.1（backend）/ v6.0.0（frontend）。变更前先 git tag + 更新两台服务器并验证。

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanjian_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lanjian}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lanjian-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lanjian-network

  backend:
    image: wutian449/lanjian-backend:v6.2.2
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanjian_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lanjian}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-lanjian_change_me}@db:5432/${POSTGRES_DB:-lanjian}
      # P0-1: SECRET_KEY 必须由宿主环境或 backend/.env 提供；未设置时 compose 层直接失败，
      # 强制阻止使用默认弱值启动。后端 config.py 还会再校验一次长度与黑名单。
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY not set - see backend/env.example for how to generate one}
      # P0-3: CORS 白名单，可选透传；未设置则沿用 backend/.env。
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      REDIS_URL: redis://redis:6379/0
      AGENT_ENABLED: "true"
      SANDBOX_ENABLED: "true"
      SANDBOX_IMAGE: wutian449/lanjian-sandbox:v6.1.0
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
      # P0-2 部署修复: /tmp/lanjian 双向绑定宿主机同名目录。
      # 原因：backend 通过 docker.sock 让 daemon 起沙箱容器，daemon 是宿主机进程，
      # 它挂载"源路径"时会去**宿主机**找 /tmp/lanjian/xxx。如果 backend 只在容器内
      # 解压 ZIP（不同步到宿主机），沙箱看到的是空目录，验证失败。
      # 加这条 bind mount 让容器内解压 = 宿主机可见。
      - /tmp/lanjian:/tmp/lanjian:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 生产/默认启动命令：单 worker，无 --reload。
    # ⚠️ 严禁在此加 --reload：文件变更会触发 uvicorn 重启，正在运行的 SSE 连接全部断开，
    # 内存中的 Orchestrator/EventManager 状态丢失，任务进入 stale running。
    # 开发热更请在 docker-compose.override.yml 中覆盖 command 加 --reload。
    command: >
      sh -c ".venv/bin/alembic upgrade head &&
             .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    networks:
      - lanjian-network

  frontend:
    image: wutian449/lanjian-frontend:v6.2.2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - lanjian-network

  sandbox:
    image: wutian449/lanjian-sandbox:v6.1.0
    restart: "no"
    command: ["sh", "-c", "echo Sandbox image ready"]

networks:
  lanjian-network:
    name: lanjian-network
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
  redis_data:
